databaseChangeLog:
  - changeSet:
      id: 020-bot
      author: boris
      changes:
        - createTable:
            tableName: bot
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: varchar(128)
                  constraints:
                    nullable: false

              - column:
                  name: strategy_type
                  type: varchar(64)
                  constraints:
                    nullable: false

              - column:
                  name: strategy_config
                  type: jsonb
                  defaultValueComputed: '''{}''::jsonb'
                  constraints:
                    nullable: false

              - column:
                  name: is_active
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
