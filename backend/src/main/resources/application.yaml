spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/trading_bot}
    username: ${DB_USERNAME:trading_bot}
    password: ${DB_PASSWORD:trading_bot}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

app:
  # Ключ шифрования секретов в БД (ключи брокера, токен Telegram).
  # Если не задан — значения хранятся открытым текстом, приложение предупредит об этом при старте.
  # Принимается base64 32 байт либо произвольная парольная фраза.
  secret-key: ${APP_SECRET_KEY:}

telegram:
  bot:
    # Только первичное заполнение чистой базы. Рабочее значение живёт в таблице app_setting
    # и задаётся на странице «Настройки» — раньше рабочий токен лежал прямо здесь и уехал в git.
    token: ${TELEGRAM_BOT_TOKEN:}
    username: ${TELEGRAM_BOT_USERNAME:}

server:
  port: 8080
