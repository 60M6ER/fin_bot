plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ru.larionov'
version = '0.0.1-SNAPSHOT'
description = 'backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    // SDK Poloniex не опубликован в Maven Central (com/poloniex там просто нет),
    // единственный способ получить его артефактом — сборка JitPack из GitHub.
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-liquibase-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'ru.tinkoff.piapi:java-sdk-core:1.49.3'
    implementation "org.telegram:telegrambots-spring-boot-starter:6.9.7.1"

    // Пин по хэшу коммита, а не master-SNAPSHOT: SDK собирается JitPack'ом из ветки,
    // и плавающая версия означала бы, что сборка меняется под нами без единой правки.
    // SDK тянет okhttp 3.12 и okio 1.15 — обе 2018 года и до исправлений известных
    // уязвимостей. Поднимаем принудительно: retrofit 2.5 обращается к okhttp через
    // те же сигнатуры, что и в 4.x, поэтому подмена для него незаметна.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okio:okio:3.9.1'

    implementation('com.github.poloniex:polo-sdk-java:4c7582ec02') {
        // Своё логирование SDK тянуть не даём: в приложении уже есть logback от Spring Boot.
        exclude group: 'org.slf4j', module: 'slf4j-api'
        // SDK объявляет lombok обычной зависимостью, хотя тот нужен только при компиляции.
        // Без exclude он уезжает в боевой jar мёртвым грузом.
        exclude group: 'org.projectlombok', module: 'lombok'
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

def frontendDir = file('../frontend')
def frontendDist = file('../frontend/dist/spa')
def skipFrontend = providers.gradleProperty('skipFrontend')
        .map { it.toBoolean() }
        .orElse(false)

tasks.register('frontendInstall', Exec) {
    group = 'build'
    description = 'Installs locked frontend dependencies.'
    workingDir frontendDir
    commandLine 'npm', 'ci', '--ignore-scripts'
    inputs.files(
            file('../frontend/package.json'),
            file('../frontend/package-lock.json')
    )
    outputs.file(file('../frontend/node_modules/.package-lock.json'))
    onlyIf { !skipFrontend.get() }
}

tasks.register('buildFrontend', Exec) {
    group = 'build'
    description = 'Builds the Quasar SPA that is packaged into the Spring Boot jar.'
    dependsOn tasks.named('frontendInstall')
    workingDir frontendDir
    commandLine 'npm', 'run', 'build'
    inputs.files(
            file('../frontend/package.json'),
            file('../frontend/package-lock.json'),
            file('../frontend/quasar.config.js'),
            file('../frontend/postcss.config.js')
    )
    inputs.dir(file('../frontend/src'))
    inputs.dir(file('../frontend/public'))
    inputs.dir(file('../frontend/scripts'))
    outputs.dir(frontendDist)
    onlyIf { !skipFrontend.get() }
}

tasks.named('bootJar') {
    dependsOn tasks.named('buildFrontend')
    from(frontendDist) {
        into 'BOOT-INF/classes/static'
    }
}
